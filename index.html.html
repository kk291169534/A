main class=\"resume-page\">\n\u003csection class=\"resume-intro\">\u003cdiv class=\"resume-identity\">\u003cp class=\"eyebrow\">关于我\u003c/p>\u003ch1>柯星宇\u003c/h1>\u003cp class=\"resume-role\">视频剪辑 / 短视频编导\u003c/p>\u003cp class=\"resume-summary\">广播电视学本科，具备短视频策划、拍摄、剪辑与账号运营经验，能够推进完整的视频制作流程。\u003c/p>\u003cdl class=\"basic-info\">\u003cdiv>\u003cdt>所在地\u003c/dt>\u003cdd>杭州\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>相关经验\u003c/dt>\u003cdd>1 年\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>年龄\u003c/dt>\u003cdd>25 岁\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>期望薪资\u003c/dt>\u003cdd>9–12K\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"resume-contact\">\u003ca href=\"mailto:291169534@qq.com\">291169534@qq.com\u003c/a>\u003ca href=\"tel:18267260932\">18267260932\u003c/a>\u003c/div>\u003ca class=\"download-resume\" href=\"assets/柯星宇-简历.docx?v=60a51bec92\" download>下载完整简历 ↓\u003c/a>\u003c/div>\u003cimg class=\"real-portrait\" src=\"assets/resume-photo.jpg\" alt=\"柯星宇的简历证件照\" width=\"180\" height=\"253\">\u003c/section>\n\u003csection class=\"highlights\" aria-label=\"关键成果\">\u003cdiv>\u003cstrong>100 万+\u003c/strong>\u003cspan>独立制作 IP 视频单条播放量\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>200 万\u003c/strong>\u003cspan>曾负责内容创作的账号粉丝量\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>3 个账号\u003c/strong>\u003cspan>参与 VERO MODA 内容制作\u003c/span>\u003c/div>\u003c/section>\n\u003csection class=\"resume-section\">\u003ch2>工作经历\u003c/h2>\u003cdiv class=\"experience-list\">\u003carticle class=\"experience\">\u003cdiv class=\"job-heading\">\u003cdiv>\u003ch3>短视频编导\u003c/h3>\u003cp class=\"employer\">菲豆（安徽）健康科技有限公司\u003c/p>\u003c/div>\u003ctime>2026.03 — 2026.10\u003c/time>\u003c/div>\u003cul>\u003cli>负责张自豪账号选题、编导、拍摄与剪辑，任职期间完成约 \u003cstrong>30–40 条\u003c/strong>视频。\u003c/li>\u003cli>独立制作公司氛围与老板主题 IP 视频，覆盖全流程，\u003cstrong>单条播放量突破 100 万\u003c/strong>，多条作品超 10 万。\u003c/li>\u003cli>协同约 5 个矩阵账号的拍摄与部分剪辑，参与数据复盘。\u003c/li>\u003c/ul>\u003c/article>\u003carticle class=\"experience\">\u003cdiv class=\"job-heading\">\u003cdiv>\u003ch3>兼职视频剪辑\u003c/h3>\u003cp class=\"employer\">深圳时刻文化传播有限公司\u003c/p>\u003c/div>\u003ctime>2025.09 — 2026.02\u003c/time>\u003c/div>\u003cul>\u003cli>为约 \u003cstrong>5–6 个百万级粉丝营销账号\u003c/strong>制作商业短视频。\u003c/li>\u003cli>负责素材整理、BGM 匹配、动画动效、广告信息融合及后期交付。\u003c/li>\u003c/ul>\u003c/article>\u003carticle class=\"experience\">\u003cdiv class=\"job-heading\">\u003cdiv>\u003ch3>视频剪辑\u003c/h3>\u003cp class=\"employer\">绫致时装（天津）有限公司\u003c/p>\u003c/div>\u003ctime>2025.03 — 2025.07\u003c/time>\u003c/div>\u003cul>\u003cli>参与 \u003cstrong>VERO MODA 旗下 3 个抖音账号\u003c/strong>的日常内容、活动视频与直播切片剪辑。\u003c/li>\u003cli>独立负责 1 个账号的内容发布与数据复盘，参与品牌宣传片剪辑调色及外拍。\u003c/li>\u003cli>累计剪辑 \u003cstrong>500 余条\u003c/strong>\u003cspan class=\"estimate\">（按工作节奏估算）\u003c/span>。\u003c/li>\u003c/ul>\u003c/article>\u003carticle class=\"experience\">\u003cdiv class=\"job-heading\">\u003cdiv>\u003ch3>市场部实习\u003c/h3>\u003cp class=\"employer\">浙江河马管家网络科技有限公司\u003c/p>\u003c/div>\u003ctime>2024.03 — 2024.07\u003c/time>\u003c/div>\u003cul>\u003cli>策划、拍摄、剪辑财税短视频与产品宣传片，参与活动拍摄、平台数据跟踪及素材归档。\u003c/li>\u003c/ul>\u003c/article>\u003c/div>\u003c/section>\n\u003csection class=\"resume-section\">\u003ch2>项目经历\u003c/h2>\u003cdiv class=\"project-list\">\u003carticle>\u003ch3>FITO 梦想屋亲子微综艺\u003c/h3>\u003cp class=\"project-role\">内容策划与拍摄统筹\u003c/p>\u003cp>策划两天一夜亲子活动，撰写拍摄脚本、统筹现场拍摄并担任主机位，首期已发布于抖音、视频号。\u003c/p>\u003c/article>\u003carticle>\u003ch3>粉丝梦想视频项目\u003c/h3>\u003cp class=\"project-role\">项目负责人\u003c/p>\u003cp>组织 \u003cstrong>5–7 人项目组\u003c/strong>，负责粉丝筛选沟通、拍摄安排、现场拍摄、剪辑及发布。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv class=\"resume-two-columns\">\u003csection class=\"resume-section\">\u003ch2>专业技能\u003c/h2>\u003cdl class=\"skill-list\">\u003cdiv>\u003cdt>DaVinci Resolve\u003c/dt>\u003cdd>剪辑、调色、基础 Fusion\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>剪映\u003c/dt>\u003cdd>剪辑与视频包装\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>TopNow\u003c/dt>\u003cdd>AI 人物资产、图像与视频生成\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Photoshop / Lightroom\u003c/dt>\u003cdd>图片处理\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"resume-section\">\u003ch2>教育与证书\u003c/h2>\u003ch3>浙江工业大学\u003c/h3>\u003cp class=\"education-line\">广播电视学 · 本科 · 2021–2025\u003c/p>\u003cp>专业排名前 \u003cstrong>30%\u003c/strong>。参与校园直播、活动拍摄及广告创意、多媒体视频竞赛。\u003c/p>\u003cul class=\"certificates\">\u003cli>普通话一级乙等\u003c/li>\u003cli>大学英语四级（CET-4）\u003c/li>\u003cli>C1 驾驶证\u003c/li>\u003c/ul>\u003c/section>\u003c/div>\n\u003cdiv class=\"resume-bottom-actions\">\u003ca class=\"bottom-home\" href=\"#/home\">← 返回首页\u003c/a>\u003ca class=\"next-works\" href=\"#/works\">查看作品 ↗\u003c/a>\u003c/div>\u003c/main>","styles":["details.css","motion.css","dot-lights.css","sounds.css"],"scripts":["dot-lights.js","audio-controller.js"]},"works":{"title":"作品 · 柯星宇","body":"\u003cdiv class=\"dot-lights\" aria-hidden=\"true\">\u003ccanvas>\u003c/canvas>\u003c/div>\u003cheader class=\"detail-header\">\u003ca class=\"back-home\" href=\"#/home\">← 返回首页\u003c/a>\u003cnav aria-label=\"主导航\">\u003ca href=\"#/about\" >关于我\u003c/a>\u003ca href=\"#/works\" aria-current=\"page\">作品\u003c/a>\u003c/nav>\u003c/header>\u003cmain>\u003cdiv class=\"page-heading\">\u003cp class=\"kicker\">精选作品 / 9 部\u003c/p>\u003ch1>作品\u003c/h1>\u003cp class=\"lede\">AI 影像、人物 IP、品牌短视频与综艺时尚。点击作品即可播放。\u003c/p>\u003c/div>\u003cdiv class=\"filters\" role=\"group\" aria-label=\"筛选作品\">\u003cbutton data-filter=\"ai\" aria-pressed=\"false\">AI 创作\u003c/button>\u003cbutton class=\"selected\" data-filter=\"all\" aria-pressed=\"true\">全部 \u003cspan>9\u003c/span>\u003c/button>\u003cbutton data-filter=\"ip\" aria-pressed=\"false\">人物 IP\u003c/button>\u003cbutton data-filter=\"brand\" aria-pressed=\"false\">品牌影像\u003c/button>\u003cbutton data-filter=\"fashion\" aria-pressed=\"false\">综艺 / 时尚\u003c/button>\u003c/div>\u003cdiv class=\"projects\">\u003carticle class=\"project glass\" data-category=\"ai\">\u003cbutton class=\"project-media\" data-video=\"assets/cosmos-ebike-ai.mp4\" data-title=\"宇宙 E- =document.createDocumentFragment();for(const n of [...parsed.body.childNodes])fragment.append(document.importNode(n,true));document.body.insertBefore(fragment,audio||null);\n   old.filter(l=>!wanted.includes(l.href)).forEach(l=>l.remove());for(const href of wanted){const l=[...document.querySelectorAll('link[rel=stylesheet]')].find(l=>l.href===href);if(l)document.head.append(l);}\n   document.title=parsed.title;if(push)history.pushState({},'',url);scrollTo(0,0);\n   for(const source of sources)new Function(source)();\n   document.dispatchEvent(new Event('site:rendered'));\n   const main=document.querySelector('main');if(main){main.setAttribute('tabindex','-1');main.focus({preventScroll:true});}\n  }catch{location.assign(url);}finally{busy=false;}\n }\n document.addEventListener('click',event=>{\n  if(event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||!(event.target instanceof Element))return;\n  const a=event.target.closest('a[href]');if(!a||a.hasAttribute('download')||a.target&&a.target!=='_self')return;\n  const url=new URL(a.href);if(url.origin!==location.origin||!supported.has(url.pathname)||url.hash&&url.pathname===location.pathname)return;\n  event.preventDefault();event.stopImmediatePropagation();if(busy||entering)return;\n  if(a.closest('.printer-open')){\n   entering=true;\n   Promise.resolve(window.resumeAudio?.preparePrinterEntry()).catch(()=>{}).then(()=>{\n    a.classList.add('is-opening');window.resumeAudio?.startMusic();\n    setTimeout(()=>{navigate(url.href).finally(()=>{entering=false;});},matchMedia('(prefers-reduced-motion: reduce)').matches?0:300);\n   });\n  }else{window.resumeAudio?.startMusic();navigate(url.href);}\n },true);\n addEventListener('popstate',()=>navigate(location.href,false));\n})();\n","home-motion.js":"// Fine pointers get a restrained perspective response; touch keeps normal links.\nconst finePointer=matchMedia('(hover: hover) and (pointer: fine)');\nconst lessMotion=matchMedia('(prefers-reduced-motion: reduce)');\ndocument.querySelectorAll('.object-link').forEach(link=>{\n let frame=0,point=null;\n function reset(){cancelAnimationFrame(frame);frame=0;point=null;link.style.removeProperty('--tilt-x');link.style.removeProperty('--tilt-y');link.style.removeProperty('--shine-x');link.style.removeProperty('--shine-y');}\n link.addEventListener('pointermove',event=>{\n  if(!finePointer.matches||lessMotion.matches)return;\n  point={x:event.clientX,y:event.clientY};\n  if(frame)return;\n  frame=requestAnimationFrame(()=>{\n   frame=0;if(!point)return;\n   const rect=link.getBoundingClientRect();\n   const x=Math.max(0,Math.min(1,(point.x-rect.left)/rect.width));\n   const y=Math.max(0,Math.min(1,(point.y-rect.top)/rect.height));\n   link.style.setProperty('--tilt-x',`${(0.5-y)*7}deg`);\n   link.style.setProperty('--tilt-y',`${(x-0.5)*9}deg`);\n   link.style.setProperty('--shine-x',`${x*100}%`);\n   link.style.setProperty('--shine-y',`${y*100}%`);\n  });\n });\n link.addEventListener('pointerleave',reset);\n link.addEventListener('pointercancel',reset);\n link.addEventListener('blur',reset);\n lessMotion.addEventListener('change',reset);\n document.addEventListener('site:before-render',()=>{reset();lessMotion.removeEventListener('change',reset);},{once:true});\n});\n","app.js":"const dialog=document.querySelector('#player'),video=document.querySelector('#full-video');\nlet opener;\ndocument.querySelectorAll('[data-video]').forEach(button=>button.addEventListener('click',()=>{opener=button;document.querySelector('#video-title').textContent=button.dataset.title;document.querySelector('#video-error').hidden=true;video.src=button.dataset.video;document.querySelector('#video-download').href=button.dataset.video;window.resumeAudio?.setVideoOpen(true);try{dialog.showModal();}catch(error){window.resumeAudio?.setVideoOpen(false);throw error;}video.play().catch(()=>{});}));\nif(dialog){document.querySelector('#close-player').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX\u003cr.left||event.clientX>r.right||event.clientY\u003cr.top||event.clientY>r.bottom)dialog.close();}});dialog.addEventListener('close',()=>{window.resumeAudio?.setVideoOpen(false);video.pause();video.removeAttribute('src');video.load();opener?.focus();});video.addEventListener('error',()=>{document.querySelector('#video-error').hidden=false;});}\ndocument.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(item=>{item.classList.toggle('selected',item===button);item.setAttribute('aria-pressed',String(item===button));});document.querySelectorAll('.project').forEach(item=>{item.hidden=button.dataset.filter!=='all'&&item.dataset.category!==button.dataset.filter;});}));\r\n\n// Folders open their matching collection; previews load only near the viewport.\nconst category=new URLSearchParams(location.hash.split('?')[1]||'').get('category');\nif(category) document.querySelector(`[data-filter=\"${CSS.escape(category)}\"]`)?.click();\nconst previews=new IntersectionObserver(entries=>entries.forEach(entry=>{\n if(entry.isIntersecting){entry.target.preload='metadata';entry.target.load();previews.unobserve(entry.target);}\n}),{rootMargin:'180px'});\ndocument.querySelectorAll('[data-lazy-video]').forEach(item=>previews.observe(item));\n\n"}}</script>
<script>
(()=>{
 'use strict';
 const bundle=JSON.parse(document.getElementById('site-bundle').textContent);
 let changing=false,entering=false;
 const persistent=new Set(['audio-controller.js','audio-system.js','sounds.js','page-flow.js']);
 function route(hash=location.hash){const [name,query='']=hash.replace(/^#\/?/,'').split('?');return {name:bundle.pages[name]?name:'cover',query};}
 function execute(page){for(const file of page.scripts){if(file==='page-flow.js')continue;if(persistent.has(file)&&window.resumeAudio)continue;new Function(bundle.scripts[file])();}}
 function render(name){
  const page=bundle.pages[name];if(!page||changing)return;changing=true;
  try{
   document.dispatchEvent(new Event('site:before-render'));
   document.querySelectorAll('video').forEach(video=>video.pause());
   const audio=window.resumeAudio?.root;
   for(const node of [...document.body.childNodes])if(node!==audio)node.remove();
   const template=document.createElement('template');template.innerHTML=page.body;
   document.body.insertBefore(template.content,audio||null);
   document.querySelectorAll('style[data-page-style]').forEach(node=>node.remove());
   for(const file of page.styles){const style=document.createElement('style');style.dataset.pageStyle=file;style.textContent=bundle.styles[file];document.head.append(style);}
   document.title=page.title;scrollTo(0,0);execute(page);
   document.dispatchEvent(new Event('site:rendered'));
   const main=document.querySelector('main');if(main){main.setAttribute('tabindex','-1');main.focus({preventScroll:true});}
  }finally{changing=false;}
 }
 function navigate(hash,push=true){const target=route(hash);if(push)history.pushState({},'',hash);render(target.name);}
 document.addEventListener('click',event=>{
  if(event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||!(event.target instanceof Element))return;
  const link=event.target.closest('a[href]');if(!link||link.hasAttribute('download')||link.target&&link.target!=='_self')return;
  const hash=link.getAttribute('href');if(!hash?.startsWith('#/'))return;
  const name=hash.slice(2).split('?')[0];if(!bundle.pages[name])return;
  event.preventDefault();event.stopImmediatePropagation();if(changing||entering)return;
  if(link.closest('.printer-open')){
   entering=true;
   Promise.resolve(window.resumeAudio?.preparePrinterEntry()).catch(()=>{}).then(()=>{
    link.classList.add('is-opening');window.resumeAudio?.startMusic();
    setTimeout(()=>{try{navigate(hash);}finally{entering=false;}},matchMedia('(prefers-reduced-motion: reduce)').matches?0:300);
   });
  }else{window.resumeAudio?.startMusic();navigate(hash);}
 },true);
 addEventListener('popstate',()=>render(route().name));
 addEventListener('hashchange',()=>{if(!changing&&!entering)render(route().name);});
 if(route().name==='cover')execute(bundle.pages.cover);else render(route().name);
})();
</script>
